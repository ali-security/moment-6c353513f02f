name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch:

env:
  NPM_CONFIG_REGISTRY: https://:2020-06-18T22%3A00%3A56.144Z@time-machines-npm.sealsecurity.io/

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '14.2.0'
      - name: Install publication-era npm
        run: npm install -g npm@6.14.5
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Minify (uglify:main)
        run: npx grunt uglify:main
      - name: Stage release tree (scripts/npm_prepublish.sh)
        run: bash scripts/npm_prepublish.sh 2.27.0
      - name: Copy minified outputs into staging
        run: cp min/*.min.js min/*.min.js.map ../moment-npm/min/
      - name: Pack
        run: |
          cd ../moment-npm
          npm pack
          mkdir -p "$GITHUB_WORKSPACE/seal-dist"
          mv moment-2.27.0.tgz "$GITHUB_WORKSPACE/seal-dist/"
          ls -l "$GITHUB_WORKSPACE/seal-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: moment-npm
          path: seal-dist/moment-2.27.0.tgz
          if-no-files-found: error
